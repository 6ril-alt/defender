<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bruno Bessou - Spécialiste Land Rover Defender</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }

        body {
            background-color: #111815;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background-color: #1a2420;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            border: 1px solid #2d3b35;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover { transform: translateY(-5px); }

        .image-container {
            width: 100%;
            height: 280px;
            position: relative;
            overflow: hidden;
            background-color: #f0f0f0;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px;
        }

        .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(26, 36, 32, 0.9);
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 6px 14px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 20px;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
        }

        .content { padding: 30px 24px; }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #d4af37;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 16px;
        }

        .tagline {
            color: #94a3b8;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .phone-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            background: linear-gradient(135deg, #d4af37, #a68a2d);
            color: #1a2420;
            text-decoration: none;
            padding: 18px 24px;
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 1px;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        .phone-button:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6);
        }

        .phone-icon { font-size: 1.4rem; }

        .footer { margin-top: 25px; font-size: 0.85rem; color: #64748b; }
    </style>
</head>
<body>

    <div class="card">
        <div class="image-container">
            <img src="defender.brz.jpg" alt="Land Rover Defender Bronze Restauré">
            <span class="badge">Expert Land Rover</span>
        </div>

        <div class="content">
            <h1>Bruno Bessou</h1>
            <div class="subtitle">The best of the Def</div>
            <p class="tagline">Spécialiste en réparation & restauration de Land Rover Defender classiques</p>

            <a href="tel:0666224600" class="phone-button">
                <span class="phone-icon">📞</span> 06.66.22.46.00
            </a>

            <div class="footer">
                Cliquez pour appeler directement
            </div>
        </div>
    </div>

</body>
</html>
